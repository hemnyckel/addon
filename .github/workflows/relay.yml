name: relay

on:
  push:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt

      - name: Install
        run: python -m pip install -r relay/requirements-dev.txt

      - name: Lint
        working-directory: relay
        run: ruff check app tests

      - name: Test
        working-directory: relay
        run: python -m pytest -q
