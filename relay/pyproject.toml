[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is a function call in a default by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
