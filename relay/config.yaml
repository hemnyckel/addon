name: "Hemnyckel"
version: "0.9.0"
slug: "hemnyckel"
description: "Hemnyckel-reläet: lokala låshändelser till Apple-notiser, och appens åtgärder tillbaka till Home Assistant."
url: "https://github.com/hemnyckel/addon"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
# Talk to Home Assistant through the supervisor, which injects the token: the
# add-on needs no Home Assistant credentials at all.
homeassistant_api: true
# The MQTT bridge: Home Assistant supplies the broker (services: mqtt:want).
# The relay uses the supervisor-injected MQTT_* environment first, then the
# Supervisor's registered MQTT service, then the mqtt_* options below. With no
# source it stays off - it never falls back to an anonymous connection.
services:
  - mqtt:want
# The app talks to the relay on the home network (and through the reverse proxy
# when away).
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Hemnyckel-reläet (appens API)"
map:
  - data:rw
  # A person's photo is mirrored here so the Home Assistant integration can read
  # it from the filesystem (and serve it over its authenticated avatar view).
  - share:rw
options:
  ha_url: ""
  ha_token: ""
  apns_key: ""
  apns_key_id: ""
  apns_team_id: ""
  bundle_id: "se.hemnyckel.app"
  apns_env: "production"
  apns_topic: ""
  live_enabled: true
  live_attributes_type: "HemnyckelLockAttributes"
  # Elpris: billigaste timmarna från en Home Assistant-prissensor. Av som
  # standard och sensorgenerisk - det publika add-onet körs även utanför
  # Sverige. Sätt energy_enabled: true och peka price_entity på din sensor.
  energy_enabled: false
  price_entity: "sensor.elpris"
  energy_window_minutes: 120
  energy_morning_time: "07:00"
  price_divisor: 100
  energy_currency: "SEK"
  energy_attributes_type: "HemnyckelEnergyAttributes"
  # The broker. Normally the relay takes it from Home Assistant (the
  # supervisor-injected MQTT_* environment, or the Supervisor's registered
  # MQTT service); these are the manual last resort for a Supervisor that
  # hands the app nothing. See docs/mqtt-bridge.md.
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  doors: []
schema:
  ha_url: str
  ha_token: password
  apns_key: str
  apns_key_id: str
  apns_team_id: str
  bundle_id: str
  apns_env: list(development|production)
  apns_topic: str
  live_enabled: bool
  live_attributes_type: str
  energy_enabled: bool
  price_entity: str
  energy_window_minutes: int
  energy_morning_time: str
  price_divisor: float
  energy_currency: str
  energy_attributes_type: str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  doors:
    - id: str
      name: str
      lock_entity: str
      door_sensor: str?
      entry_id: str?
