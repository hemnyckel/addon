name: "Hemnyckel relay"
version: "0.1.0"
slug: "hemnyckel"
description: "Local push relay for the Hemnyckel iOS app: lock events to Apple push, and app actions back to Home Assistant."
url: "https://github.com/your-user/hemnyckel"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
map:
  - data:rw
options:
  ha_url: ""
  ha_token: ""
  apns_key: ""
  apns_key_id: ""
  apns_team_id: ""
  bundle_id: "se.hemnyckel.app"
  doors: []
schema:
  ha_url: str
  ha_token: password
  apns_key: str
  apns_key_id: str
  apns_team_id: str
  bundle_id: str
  doors:
    - id: str
      name: str
      lock_entity: str
      door_sensor: str?
      entry_id: str?
