name: "Hemnyckel"
version: "0.1.0"
slug: "hemnyckel"
description: "Hemnyckel-reläet: lokala låshändelser till Apple-notiser, och appens åtgärder tillbaka till Home Assistant."
url: "https://github.com/c14ym0re/hemnyckel"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
# Talk to Home Assistant through the supervisor, which injects the token: the
# add-on needs no Home Assistant credentials at all.
homeassistant_api: true
# The app talks to the relay on the home network (and through the reverse proxy
# when away).
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Hemnyckel-reläet (appens API)"
map:
  - data:rw
options:
  ha_url: ""
  ha_token: ""
  apns_key: ""
  apns_key_id: ""
  apns_team_id: ""
  bundle_id: "se.hemnyckel.app"
  apns_env: "production"
  apns_topic: ""
  live_enabled: true
  live_attributes_type: "HemnyckelLockAttributes"
  doors: []
schema:
  ha_url: str
  ha_token: password
  apns_key: str
  apns_key_id: str
  apns_team_id: str
  bundle_id: str
  apns_env: list(development|production)
  apns_topic: str
  live_enabled: bool
  live_attributes_type: str
  doors:
    - id: str
      name: str
      lock_entity: str
      door_sensor: str?
      entry_id: str?
